<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Chat — ChatGPT UI Kit</title>
<style>
  :root {
    --sidebar-bg: #171717;
    --sidebar-border: #2f2f2f;
    --chat-bg: #212121;
    --message-user-bg: #2f2f2f;
    --message-ai-bg: transparent;
    --input-bg: #2f2f2f;
    --input-border: #565869;
    --text-primary: #ececec;
    --text-secondary: #b4b4b4;
    --text-dim: #8e8e8e;
    --accent: #10a37f;
    --accent-hover: #0e8f6f;
    --hover-bg: #2a2a2a;
    --danger: #ef4146;
    --radius: 12px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--chat-bg);
    color: var(--text-primary);
    overflow: hidden;
  }

  .app {
    display: flex;
    height: 100vh;
  }

  /* ================= Sidebar ================= */
  .sidebar {
    width: 260px;
    min-width: 260px;
    background: var(--sidebar-bg);
    border-right: 1px solid var(--sidebar-border);
    display: flex;
    flex-direction: column;
    transition: transform 0.2s ease;
  }

  .sidebar-header {
    padding: 12px;
  }

  .logo {
    display: block;
    width: 140px;
    height: auto;
    margin: 6px 0 12px;
    object-fit: contain;
    border-radius: 8px;
  }

  .welcome-logo {
    display: block;
    width: 120px;
    height: auto;
    margin: 0 auto 16px;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 8px 20px rgba(0,0,0,0.5);
  }

  .new-chat-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    width: 100%;
    padding: 12px 14px;
    background: transparent;
    border: 1px solid var(--sidebar-border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 0.9rem;
    cursor: pointer;
    transition: background 0.15s;
  }

  .new-chat-btn:hover { background: var(--hover-bg); }

  .new-chat-btn svg { width: 16px; height: 16px; }

  .sidebar-section {
    padding: 12px 12px 4px;
    font-size: 0.7rem;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--text-dim);
    font-weight: 600;
  }

  .chat-list {
    flex: 1;
    overflow-y: auto;
    padding: 4px 8px 8px;
  }

  .chat-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 10px;
    border-radius: 8px;
    cursor: pointer;
    color: var(--text-secondary);
    font-size: 0.85rem;
    transition: background 0.15s;
    position: relative;
    margin-bottom: 2px;
  }

  .chat-item:hover { background: var(--hover-bg); color: var(--text-primary); }
  .chat-item.active { background: var(--hover-bg); color: var(--text-primary); }

  .chat-item svg { width: 16px; height: 16px; flex-shrink: 0; }

  .chat-item .chat-title {
    flex: 1;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .chat-item .chat-date {
    font-size: 0.7rem;
    color: var(--text-dim);
  }

  .sidebar-footer {
    padding: 12px;
    border-top: 1px solid var(--sidebar-border);
  }

  .user-card {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 10px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s;
  }

  .user-card:hover { background: var(--hover-bg); }

  .avatar {
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, #5436da, #7d5ff0);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.85rem;
    font-weight: 600;
    color: #fff;
    flex-shrink: 0;
  }

  .user-info {
    flex: 1;
    display: flex;
    flex-direction: column;
  }

  .user-name { font-size: 0.85rem; }
  .user-email { font-size: 0.75rem; color: var(--text-dim); }

  /* ================= Main Chat ================= */
  .main {
    flex: 1;
    display: flex;
    flex-direction: column;
    position: relative;
  }

  .mobile-menu-btn {
    display: none;
    position: absolute;
    top: 12px;
    left: 12px;
    z-index: 10;
    background: transparent;
    border: none;
    color: var(--text-primary);
    cursor: pointer;
    padding: 6px;
    border-radius: 6px;
  }

  .mobile-menu-btn:hover { background: var(--hover-bg); }

  .chat-header {
    display: none;
    padding: 12px;
    text-align: center;
    font-size: 0.9rem;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--sidebar-border);
  }

  .messages {
    flex: 1;
    overflow-y: auto;
    scroll-behavior: smooth;
  }

  .message {
    display: flex;
    gap: 16px;
    padding: 24px 20px;
    max-width: 860px;
    margin: 0 auto;
  }

  .message.ai { background: var(--message-ai-bg); }
  .message.user { background: var(--message-user-bg); }

  .message .msg-avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
  }

  .message.user .msg-avatar {
    background: linear-gradient(135deg, #5436da, #7d5ff0);
    color: #fff;
    font-weight: 600;
  }

  .message.ai .msg-avatar {
    background: #10a37f;
    color: #fff;
  }

  .message .msg-body {
    flex: 1;
    font-size: 0.95rem;
    line-height: 1.7;
    padding-top: 4px;
  }

  .message .msg-body p { margin-bottom: 12px; }
  .message .msg-body p:last-child { margin-bottom: 0; }

  .message .msg-body .timestamp {
    font-size: 0.75rem;
    color: var(--text-dim);
    margin-top: 8px;
  }

  /* ================= Composer ================= */
  .composer-wrap {
    padding: 0 20px 20px;
    max-width: 860px;
    margin: 0 auto;
    width: 100%;
  }

  .composer {
    display: flex;
    align-items: flex-end;
    gap: 8px;
    background: var(--input-bg);
    border: 1px solid var(--input-border);
    border-radius: 24px;
    padding: 8px 8px 8px 16px;
    transition: border-color 0.15s;
  }

  .composer:focus-within { border-color: var(--accent); }

  .composer textarea {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: var(--text-primary);
    font-family: inherit;
    font-size: 0.95rem;
    line-height: 1.5;
    max-height: 200px;
    padding: 8px 0;
  }

  .composer textarea::placeholder { color: var(--text-dim); }

  .composer-actions {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .icon-btn {
    background: transparent;
    border: none;
    color: var(--text-secondary);
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: background 0.15s, color 0.15s;
  }

  .icon-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-primary); }

  .icon-btn svg { width: 18px; height: 18px; }

  .send-btn {
    background: var(--accent);
    border: none;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    cursor: pointer;
    transition: background 0.15s, opacity 0.15s;
  }

  .send-btn:hover { background: var(--accent-hover); }
  .send-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .send-btn svg { width: 18px; height: 18px; }

  .disclaimer {
    text-align: center;
    font-size: 0.72rem;
    color: var(--text-dim);
    margin-top: 10px;
  }

  /* ================= Sidebar overlay (mobile) ================= */
  .sidebar-overlay {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 20;
  }

  .sidebar-overlay.show { display: block; }

  @media (max-width: 768px) {
    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      z-index: 30;
      transform: translateX(-100%);
    }
    .sidebar.open { transform: translateX(0); }
    .mobile-menu-btn { display: flex; }
    .chat-header { display: block; padding-left: 56px; }
    .messages .message { padding: 20px 16px; }
  }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #4a4a4a; border-radius: 4px; }
  ::-webkit-scrollbar-thumb:hover { background: #5a5a5a; }
</style>
</head>
<body>
<div class="app">

  <!-- ============ Sidebar ============ -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <img src="assets/quantiva.jpg" alt="Quantiva logo" class="logo">
      <button class="new-chat-btn" id="newChatBtn">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M8 3v10M3 8h10" stroke-linecap="round"/>
        </svg>
        New chat
      </button>
    </div>

    <div class="sidebar-section">Recent</div>
    <nav class="chat-list" id="chatList">
      <!-- Chat items injected by JS -->
    </nav>

    <div class="sidebar-footer">
      <div class="user-card">
        <div class="avatar">R</div>
        <div class="user-info">
          <span class="user-name">Ridham Gupta</span>
          <span class="user-email">Free plan</span>
        </div>
        <svg width="18" height="18" viewBox="0 0 16 16" fill="none" stroke="currentColor" style="color:var(--text-dim)">
          <path d="M4 6l4 4 4-4" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <!-- ============ Main Chat ============ -->
  <main class="main">
    <button class="mobile-menu-btn" id="menuBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round"/>
      </svg>
    </button>
    <div class="chat-header" id="chatHeader">New chat</div>

    <div class="messages" id="messages">
      <!-- Messages injected by JS -->
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Message AI Chat…" autofocus></textarea>
        <div class="composer-actions">
          <button class="icon-btn" title="Attach" id="attachBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
          <button class="send-btn" id="sendBtn" disabled>
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 2L11 13M22 2l-7 20-4-9-9-4 20-7z" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
          </button>
        </div>
      </div>
      <p class="disclaimer">AI Chat can make mistakes. Consider checking important information.</p>
    </div>
  </main>
</div>

<script>
  // ============ State ============
  const chats = [
    { id: 1, title: "Explain transformers", date: "Today" },
    { id: 2, title: "GPT attention heads", date: "Yesterday" },
    { id: 3, title: "Flash attention math", date: "Yesterday" },
    { id: 4, title: "MFU calculation", date: "3 days ago" },
    { id: 5, title: "Learning rate schedules", date: "5 days ago" },
  ];

  let activeChatId = null;
  let isMobile = window.innerWidth <= 768;

  // ============ Elements ============
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('sidebarOverlay');
  const menuBtn = document.getElementById('menuBtn');
  const chatList = document.getElementById('chatList');
  const messagesEl = document.getElementById('messages');
  const input = document.getElementById('input');
  const sendBtn = document.getElementById('sendBtn');
  const newChatBtn = document.getElementById('newChatBtn');
  const chatHeader = document.getElementById('chatHeader');

  // ============ Icons ============
  const msgIcons = {
    user: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>`,
    ai: `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3l1.9 5.8a2 2 0 001.3 1.3L21 12l-5.8 1.9a2 2 0 00-1.3 1.3L12 21l-1.9-5.8a2 2 0 00-1.3-1.3L3 12l5.8-1.9a2 2 0 001.3-1.3L12 3z" stroke-linejoin="round"/></svg>`
  };

  // ============ Render chat list ============
  function renderChatList() {
    chatList.innerHTML = '';
    chats.forEach(chat => {
      const item = document.createElement('div');
      item.className = 'chat-item' + (chat.id === activeChatId ? ' active' : '');
      item.innerHTML = `
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M21 15a2 2 0 01-2 2H7l-4 4V5a2 2 0 012-2h14a2 2 0 012 2z" stroke-linejoin="round"/>
        </svg>
        <span class="chat-title">${chat.title}</span>
        <span class="chat-date">${chat.date}</span>
      `;
      item.addEventListener('click', () => selectChat(chat.id));
      chatList.appendChild(item);
    });
  }

  // ============ Welcome screen ============
  function renderWelcome() {
    messagesEl.innerHTML = `
      <div style="max-width:760px;margin:10vh auto 0;padding:0 20px;text-align:center">
        <img src="assets/quantiva.jpg" alt="Quantiva logo" class="welcome-logo">
        <h1 style="font-size:1.6rem;font-weight:600;margin-bottom:6px">How can I help you today?</h1>
        <p style="color:var(--text-secondary);font-size:0.95rem">Ask me anything about GPT, transformers, or Quantiva</p>
      </div>
    `;
  }

  // ============ Render messages ============
  function renderMessages(chatId) {
    messagesEl.innerHTML = '';
    const chat = chats.find(c => c.id === chatId);
    if (!chat || !chat.messages || chat.messages.length === 0) { renderWelcome(); return; }
    chat.messages.forEach(m => appendMessageEl(m.role, m.text, false));
    scrollToBottom();
  }

  function appendMessageEl(role, text, scroll = true) {
    const el = document.createElement('div');
    el.className = `message ${role}`;
    const now = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    el.innerHTML = `
      <div class="msg-avatar">${role === 'user' ? 'R' : msgIcons.ai}</div>
      <div class="msg-body">
        <p>${text.replace(/\n/g, '<br>')}</p>
        <div class="timestamp">${now}</div>
      </div>
    `;
    messagesEl.appendChild(el);
    if (scroll) scrollToBottom();
  }

  function scrollToBottom() {
    requestAnimationFrame(() => { messagesEl.scrollTop = messagesEl.scrollHeight; });
  }

  // ============ Chat selection ============
  function selectChat(id) {
    activeChatId = id;
    renderChatList();
    renderMessages(id);
    chatHeader.textContent = chats.find(c => c.id === id)?.title || 'New chat';
    closeSidebar();
  }

  // ============ Send message ============
  function sendMessage() {
    const text = input.value.trim();
    if (!text) return;
    input.value = '';
    input.style.height = 'auto';
    sendBtn.disabled = true;

    // Ensure a chat exists
    if (!activeChatId) {
      const id = Date.now();
      chats.unshift({ id, title: text.slice(0, 28) + (text.length > 28 ? '…' : ''), date: 'Now', messages: [] });
      activeChatId = id;
      renderChatList();
      chatHeader.textContent = chats.find(c => c.id === id).title;
    }

    const chat = chats.find(c => c.id === activeChatId);
    chat.messages = chat.messages || [];
    chat.messages.push({ role: 'user', text });
    appendMessageEl('user', text);
    renderChatList();

    // Simulated AI reply
    setTimeout(() => {
      const reply = `Great question about *"${text.slice(0, 60)}"*.\n\nHere's what I know:\n\n• GPT models are decoder-only transformers trained on next-token prediction.\n• Attention lets each token attend to all previous tokens (causal masking).\n• Quantiva is a minimal (~300 line) implementation you can train on a single GPU.\n\nWant me to dive deeper into any part?`;
      chat.messages.push({ role: 'ai', text: reply });
      appendMessageEl('ai', reply);
      renderChatList();
      chatHeader.textContent = chat.title;
    }, 700);
  }

  // ============ New chat ============
  function newChat() {
    activeChatId = null;
    chatHeader.textContent = 'New chat';
    renderChatList();
    renderWelcome();
    closeSidebar();
    input.focus();
  }

  // ============ Sidebar (mobile) ============
  function openSidebar() { sidebar.classList.add('open'); overlay.classList.add('show'); }
  function closeSidebar() { sidebar.classList.remove('open'); overlay.classList.remove('show'); }

  menuBtn.addEventListener('click', openSidebar);
  overlay.addEventListener('click', closeSidebar);

  // ============ Input handling ============
  input.addEventListener('input', () => {
    input.style.height = 'auto';
    input.style.height = Math.min(input.scrollHeight, 200) + 'px';
    sendBtn.disabled = !input.value.trim();
  });

  input.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  sendBtn.addEventListener('click', sendMessage);
  newChatBtn.addEventListener('click', newChat);
  document.getElementById('attachBtn').addEventListener('click', () => {
    alert('Attachment upload is not implemented in this static demo.');
  });

  // ============ Init ============
  renderChatList();
  newChat();

  window.addEventListener('resize', () => {
    isMobile = window.innerWidth <= 768;
    if (!isMobile) closeSidebar();
  });
</script>
</body>
</html>
