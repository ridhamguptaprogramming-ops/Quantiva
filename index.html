<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantiva — AI Assistant</title>
<meta name="description" content="Quantiva — a premium AI assistant for code, research, files and ideas.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0F19;--bg-2:#0e1424;--sidebar-bg:#111827;--card:rgba(255,255,255,0.04);--card-hover:rgba(255,255,255,0.07);--border:rgba(255,255,255,0.08);--border-strong:rgba(255,255,255,0.14);--text-primary:#f3f4f6;--text-secondary:#9ca3af;--text-dim:#6b7280;--accent1:#00E5FF;--accent2:#7C3AED;--accent3:#3B82F6;--gradient:linear-gradient(135deg,#00E5FF 0%,#3B82F6 50%,#7C3AED 100%);--glow:rgba(59,130,246,0.35);--input-bg:rgba(255,255,255,0.04);--danger:#f87171;--success:#34d399;--grid-line:rgba(148,163,184,0.07);--noise-opacity:0.04;--shadow-sm:0 2px 8px rgba(0,0,0,0.3);--shadow-md:0 8px 24px rgba(0,0,0,0.4);--shadow-glow:0 0 24px rgba(59,130,246,0.25),0 0 60px rgba(124,58,237,0.15);--radius:16px;--font:Inter,-apple-system,BlinkMacSystemFont,Segoe UI,Helvetica,Arial,sans-serif}
[data-theme=light]{--bg:#f4f5fb;--bg-2:#eef0f8;--sidebar-bg:#fff;--card:rgba(17,24,39,0.04);--card-hover:rgba(17,24,39,0.07);--border:rgba(17,24,39,0.08);--border-strong:rgba(17,24,39,0.14);--text-primary:#0f172a;--text-secondary:#475569;--text-dim:#94a3b8;--input-bg:rgba(255,255,255,0.7);--grid-line:rgba(15,23,42,0.05);--noise-opacity:0.02;--glow:rgba(59,130,246,0.25);--shadow-sm:0 2px 8px rgba(15,23,42,0.06);--shadow-md:0 8px 24px rgba(15,23,42,0.08);--shadow-glow:0 0 24px rgba(59,130,246,0.18),0 0 60px rgba(124,58,237,0.10)}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);overflow:hidden;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button{font-family:inherit;cursor:pointer}
::selection{background:rgba(124,58,237,0.35);color:#fff}
:focus-visible{outline:2px solid var(--accent1);outline-offset:2px;border-radius:6px}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(148,163,184,0.2);border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:rgba(148,163,184,0.35)}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.bg-base{position:absolute;inset:0;background:radial-gradient(1100px 600px at 80% -10%,rgba(124,58,237,0.18),transparent 60%),radial-gradient(900px 500px at 10% 110%,rgba(0,229,255,0.10),transparent 60%),radial-gradient(700px 400px at 50% 50%,rgba(59,130,246,0.06),transparent 70%),var(--bg)}
.bg-grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid-line) 1px,transparent 1px),linear-gradient(90deg,var(--grid-line) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 75%);mask-image:radial-gradient(ellipse 80% 60% at 50% 0%,#000 20%,transparent 75%)}
.bg-noise{position:absolute;inset:0;opacity:var(--noise-opacity);background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E")}
.orb{position:absolute;border-radius:50%;filter:blur(90px)}
.orb-1{width:420px;height:420px;top:-120px;right:-80px;background:radial-gradient(circle,rgba(124,58,237,0.55),transparent 65%);animation:float1 14s ease-in-out infinite}
.orb-2{width:360px;height:360px;bottom:-140px;left:-100px;background:radial-gradient(circle,rgba(0,229,255,0.4),transparent 65%);animation:float2 18s ease-in-out infinite}
.orb-3{width:260px;height:260px;top:40%;left:55%;background:radial-gradient(circle,rgba(59,130,246,0.4),transparent 65%);animation:float1 22s ease-in-out infinite reverse}
.particle{position:absolute;border-radius:50%;background:rgba(255,255,255,0.5);animation:floatUp linear infinite}
[data-theme=light] .particle{background:rgba(15,23,42,0.35)}
@keyframes float1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(40px,-30px) scale(1.08)}}
@keyframes float2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,40px) scale(1.1)}}
@keyframes floatUp{0%{transform:translateY(0);opacity:0}10%{opacity:var(--po,0.4)}90%{opacity:var(--po,0.4)}100%{transform:translateY(-100vh);opacity:0}}
.app{position:relative;z-index:1;display:flex;height:100vh;width:100vw;overflow:hidden}
.sidebar{width:280px;min-width:280px;height:100%;background:var(--sidebar-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:relative;z-index:30;transition:transform .3s ease}
.sidebar-inner{display:flex;flex-direction:column;height:100%;padding:16px 12px}
.sidebar-logo-wrap{display:flex;align-items:center;gap:12px;padding:4px 8px 16px;position:relative}
.logo-shell{position:relative;width:42px;height:42px;flex-shrink:0;border-radius:12px;overflow:visible}
.logo-glow{position:absolute;inset:-4px;border-radius:14px;background:var(--gradient);filter:blur(14px);opacity:.7;animation:logoPulse 3.5s ease-in-out infinite}
.logo-img{position:relative;width:42px;height:42px;border-radius:12px;object-fit:cover;border:1px solid var(--border-strong);background:#0B0F19;z-index:1}
.logo-text{display:flex;flex-direction:column;line-height:1.15;z-index:1}
.logo-name{font-weight:800;font-size:1.15rem;letter-spacing:-.02em;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.logo-tag{font-size:.66rem;color:var(--text-dim);font-weight:500;letter-spacing:.08em;text-transform:uppercase}
@keyframes logoPulse{0%,100%{opacity:.6;transform:scale(1)}50%{opacity:.9;transform:scale(1.06)}}
.new-chat{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;margin-bottom:12px;background:var(--card);border:1px solid var(--border);border-radius:14px;color:var(--text-primary);font-size:.9rem;font-weight:500;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:all .25s}
.new-chat svg{transition:transform .3s cubic-bezier(.34,1.56,.64,1)}
.new-chat:hover{background:var(--card-hover);border-color:rgba(0,229,255,0.3);box-shadow:0 0 24px rgba(124,58,237,0.18),0 0 0 1px rgba(255,255,255,0.04)}
.new-chat:hover svg{transform:rotate(90deg) scale(1.15)}
.search-box{display:flex;align-items:center;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:9px 12px;margin-bottom:14px;color:var(--text-dim);transition:border-color .25s,box-shadow .25s}
.search-box:focus-within{border-color:rgba(0,229,255,0.4);box-shadow:0 0 0 3px rgba(0,229,255,0.08)}
.search-box input{flex:1;background:0 0;border:none;outline:0;color:var(--text-primary);font-size:.85rem;font-family:inherit}
.search-box input::placeholder{color:var(--text-dim)}
.kbd{font-size:.66rem;padding:2px 6px;border-radius:5px;font-weight:600;background:var(--card-hover);border:1px solid var(--border);color:var(--text-dim);font-family:var(--font);letter-spacing:.03em}
.section-label{display:flex;align-items:center;gap:6px;padding:6px 10px 8px;font-size:.66rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);font-weight:700}
.chat-list{flex:1;overflow-y:auto;padding:2px 2px 8px;display:flex;flex-direction:column;gap:2px}
.chat-empty{padding:18px 12px;text-align:center;color:var(--text-dim);font-size:.8rem}
.chat-item{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;position:relative;border:1px solid transparent;user-select:none;transition:all .2s}
.chat-item:hover{background:var(--card-hover)}
.chat-item.active{background:linear-gradient(135deg,rgba(0,229,255,0.06),rgba(124,58,237,0.10));border-color:rgba(124,58,237,0.22)}
.chat-item.active::before{content:'';position:absolute;left:0;top:20%;bottom:20%;width:3px;background:var(--gradient);border-radius:0 3px 3px 0}
.chat-icon{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--card);color:var(--text-secondary);font-size:.8rem}
.chat-item .chat-info{flex:1;min-width:0}
.chat-item .chat-title{font-size:.82rem;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-item .chat-preview{font-size:.7rem;color:var(--text-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.chat-item .chat-time{font-size:.65rem;color:var(--text-dim);flex-shrink:0}
.sidebar-footer{margin-top:auto;padding-top:12px;border-top:1px solid var(--border)}
.user-card{display:flex;align-items:center;gap:10px;padding:10px;border-radius:12px;cursor:pointer;transition:all .2s}
.user-card:hover{background:var(--card-hover)}
.avatar{width:34px;height:34px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;font-size:.85rem;font-weight:600;color:#fff;flex-shrink:0}
.user-info{flex:1;min-width:0}
.user-name{font-size:.82rem;font-weight:500}
.user-email{font-size:.7rem;color:var(--text-dim)}
.storage-wrap{padding:8px 10px 0}
.storage-bar{height:3px;background:var(--card);border-radius:4px;overflow:hidden}
.storage-fill{height:100%;background:var(--gradient);border-radius:4px;transition:width .6s ease}
.storage-text{font-size:.65rem;color:var(--text-dim);margin-top:5px;display:flex;justify-content:space-between}
.user-actions{display:flex;gap:2px;margin-top:6px}
.user-actions button{flex:1;display:flex;align-items:center;justify-content:center;gap:5px;padding:7px;border-radius:8px;border:none;background:0 0;color:var(--text-dim);font-size:.7rem;cursor:pointer;transition:all .2s}
.user-actions button:hover{background:var(--card-hover);color:var(--text-primary)}
.navbar{position:absolute;top:0;left:0;right:0;height:56px;z-index:20;display:flex;align-items:center;padding:0 24px;gap:16px;background:rgba(11,15,25,0.7);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-bottom:1px solid var(--border)}
.nav-left{display:flex;align-items:center;gap:8px;font-size:.9rem;font-weight:500;color:var(--text-primary)}
.nav-center{flex:1;display:flex;align-items:center;justify-content:center;gap:6px}
.model-selector{display:flex;align-items:center;gap:4px;padding:5px 12px 5px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);color:var(--text-primary);font-size:.78rem;font-weight:500;cursor:pointer;transition:all .2s}
.model-selector:hover{background:var(--card-hover);border-color:rgba(0,229,255,0.3)}
.model-selector svg{width:14px;height:14px}
.nav-right{display:flex;align-items:center;gap:4px}
.nav-icon-btn{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:0 0;border:none;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.nav-icon-btn:hover{background:var(--card-hover);color:var(--text-primary)}
.nav-avatar{width:30px;height:30px;border-radius:50%;background:var(--gradient);display:flex;align-items:center;justify-content:center;color:#fff;font-size:.75rem;font-weight:600;cursor:pointer;transition:all .2s}
.main-area{flex:1;display:flex;flex-direction:column;position:relative;overflow:hidden}
.main-scroll{flex:1;overflow-y:auto;padding-top:56px;display:flex;flex-direction:column}
.main-content{flex:1;width:100%;max-width:900px;margin:0 auto;padding:40px 24px 20px;display:flex;flex-direction:column}
.empty-state{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px 0}
.ai-orb-wrap{position:relative;width:140px;height:140px;margin-bottom:24px}
.ai-orb-inner{position:absolute;inset:0;border-radius:50%;background:var(--gradient);filter:blur(6px);opacity:.4;animation:orbPulse 4s ease-in-out infinite}
.ai-orb-core{position:absolute;inset:10px;border-radius:50%;background:var(--bg);border:1px solid var(--border-strong);display:flex;align-items:center;justify-content:center;z-index:1;overflow:hidden}
.ai-orb-core img{width:70%;height:70%;object-fit:contain;border-radius:8px;opacity:.9}
.ai-orb-ring{position:absolute;inset:-8px;border-radius:50%;border:1px solid rgba(0,229,255,0.15);animation:spin 12s linear infinite}
.ai-orb-ring2{position:absolute;inset:-14px;border-radius:50%;border:1px dashed rgba(124,58,237,0.12);animation:spin 20s linear infinite reverse}
@keyframes orbPulse{0%,100%{transform:scale(1);opacity:.4}50%{transform:scale(1.1);opacity:.6}}
@keyframes spin{to{transform:rotate(360deg)}}
.greeting{font-size:1.8rem;font-weight:800;letter-spacing:-.03em;background:var(--gradient);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:6px}
.subtitle{font-size:.95rem;color:var(--text-secondary);margin-bottom:20px;max-width:600px;line-height:1.6}
.quick-actions{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px;width:100%;margin-bottom:24px}
.qa-card{display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);cursor:pointer;text-align:left;transition:all .25s;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.qa-card:hover{background:var(--card-hover);border-color:rgba(0,229,255,0.2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.2)}
.qa-card .qa-icon{font-size:1.3rem;line-height:1}
.qa-card .qa-label{font-size:.78rem;color:var(--text-primary);font-weight:500;line-height:1.3}
.qa-card .qa-desc{font-size:.65rem;color:var(--text-dim);line-height:1.3}
.premium-section{width:100%;margin-bottom:20px}
.premium-section h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.1em;color:var(--text-dim);font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:6px}
.trending-list{display:flex;flex-wrap:wrap;gap:8px}
.trending-tag{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:10px;background:var(--card);border:1px solid var(--border);font-size:.78rem;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.trending-tag:hover{background:var(--card-hover);border-color:rgba(124,58,237,0.25);color:var(--text-primary);transform:translateY(-1px)}
.trending-tag .tt-icon{font-size:1rem}
.drag-zone{width:100%;padding:28px 20px;border-radius:14px;border:1px dashed var(--border);background:var(--card);text-align:center;margin-bottom:20px;transition:all .25s;cursor:pointer}
.drag-zone:hover{border-color:rgba(0,229,255,0.3);background:rgba(0,229,255,0.03)}
.drag-zone svg{width:28px;height:28px;color:var(--text-dim);margin-bottom:8px}
.drag-zone p{font-size:.82rem;color:var(--text-secondary);margin-bottom:4px}
.drag-zone .formats{font-size:.65rem;color:var(--text-dim);display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.drag-zone .formats span{padding:2px 8px;border-radius:4px;background:var(--card);border:1px solid var(--border)}
.extra-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;margin-bottom:20px}
.extra-card{display:flex;align-items:flex-start;gap:10px;padding:14px;border-radius:14px;background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .25s}
.extra-card:hover{background:var(--card-hover);border-color:rgba(0,229,255,0.2);transform:translateY(-1px)}
.extra-card .ec-icon{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:var(--gradient);font-size:1rem;flex-shrink:0}
.extra-card .ec-info{flex:1;min-width:0}
.extra-card .ec-title{font-size:.82rem;font-weight:500;margin-bottom:2px}
.extra-card .ec-desc{font-size:.7rem;color:var(--text-dim);line-height:1.3}
.composer-wrap{width:100%;max-width:900px;margin:0 auto;padding:0 24px 24px}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--card);border:1px solid var(--border);border-radius:20px;padding:8px 8px 8px 18px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);transition:all .25s;position:relative}
.composer:focus-within{border-color:rgba(0,229,255,0.35);box-shadow:0 0 0 3px rgba(0,229,255,0.06),0 0 32px rgba(124,58,237,0.08)}
.composer textarea{flex:1;background:0 0;border:none;outline:0;resize:none;color:var(--text-primary);font-family:var(--font);font-size:.95rem;line-height:1.5;max-height:200px;padding:10px 0;min-height:28px}
.composer textarea::placeholder{color:var(--text-dim)}
.composer-actions{display:flex;align-items:center;gap:2px;flex-shrink:0}
.composer-icon-btn{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:0 0;border:none;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.composer-icon-btn:hover{background:var(--card-hover);color:var(--text-primary)}
.composer-icon-btn svg{width:17px;height:17px}
.composer-icon-btn.active{color:var(--accent1)}
.send-btn{width:38px;height:38px;border-radius:50%;background:var(--gradient);border:none;display:flex;align-items:center;justify-content:center;color:#fff;cursor:pointer;transition:all .25s;box-shadow:0 0 0 0 rgba(59,130,246,0);flex-shrink:0}
.send-btn:hover{transform:scale(1.08);box-shadow:0 0 20px rgba(59,130,246,0.35)}
.send-btn:active{transform:scale(.95)}
.send-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.send-btn svg{width:18px;height:18px}
.composer-row{display:flex;align-items:center;gap:6px;padding:4px 0 2px}
.composer-badge{display:flex;align-items:center;gap:5px;padding:3px 10px 3px 8px;border-radius:7px;background:var(--card-hover);border:1px solid var(--border);font-size:.7rem;color:var(--text-secondary);cursor:pointer;transition:all .2s}
.composer-badge:hover{background:var(--card);border-color:rgba(0,229,255,0.25);color:var(--text-primary)}
.composer-badge svg{width:12px;height:12px}
.composer-badge.active{color:var(--accent1);border-color:rgba(0,229,255,0.3)}
.disclaimer{text-align:center;font-size:.68rem;color:var(--text-dim);margin-top:10px}
.chat-view{flex:1;padding:20px 0;display:flex;flex-direction:column;gap:16px}
.message-row{display:flex;gap:14px;padding:6px 0;animation:fadeUp .35s ease}
.message-row.user{flex-direction:row-reverse}
.msg-avatar{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:.75rem;font-weight:600;color:#fff}
.msg-avatar.ai{background:var(--gradient)}
.msg-avatar.user{background:var(--accent2)}
.msg-bubble{max-width:75%;padding:12px 16px;border-radius:14px;font-size:.92rem;line-height:1.7}
.message-row.user .msg-bubble{background:var(--gradient);color:#fff;border-radius:14px 14px 4px 14px}
.message-row.ai .msg-bubble{background:var(--card);border:1px solid var(--border);border-radius:14px 14px 14px 4px}
.msg-meta{display:flex;align-items:center;gap:8px;margin-top:6px;font-size:.7rem;color:var(--text-dim)}
.msg-meta span{cursor:pointer}
.msg-meta span:hover{color:var(--text-primary)}
.typing-indicator{display:flex;align-items:center;gap:4px;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:14px;width:fit-content}
.typing-dot{width:6px;height:6px;border-radius:50%;background:var(--text-dim);animation:typingBounce 1.2s ease-in-out infinite}
.typing-dot:nth-child(2){animation-delay:.2s}
.typing-dot:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-6px);opacity:1}}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
@media(prefers-reduced-motion:reduce){.orb,.particle,.new-chat svg,.chat-item,.qa-card,.trending-tag,.extra-card,.send-btn,.ai-orb-inner,.ai-orb-ring,.ai-orb-ring2,.logo-glow{animation:none!important;transition:none!important}}
@media(max-width:768px){.sidebar{position:fixed;left:0;top:0;bottom:0;z-index:40;transform:translateX(-100%)}.sidebar.open{transform:translateX(0)}.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:35}.sidebar-overlay.show{display:block}.quick-actions{grid-template-columns:repeat(auto-fill,minmax(140px,1fr))}.extra-grid{grid-template-columns:1fr}.composer-wrap{padding:0 12px 16px}.main-content{padding:24px 16px 16px}.navbar{padding:0 12px;gap:8px}.greeting{font-size:1.5rem}.nav-center{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<script>

// ---- HELPERS ----
const $ = (tag, attrs, ...children) => {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (k === 'className') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on')) el.addEventListener(k.slice(2).toLowerCase(), v);
      else if (k === 'htmlFor') el.setAttribute('for', v);
      else if (k === 'disabled' || k === 'readOnly' || k === 'checked') v ? el.setAttribute(k, '') : null;
      else if (k === 'dangerouslySetInnerHTML') el.innerHTML = v.__html;
      else el.setAttribute(k, v);
    }
  }
  for (const child of children) {
    if (child == null || child === false) continue;
    if (typeof child === 'string' || typeof child === 'number') el.appendChild(document.createTextNode(child));
    else if (child instanceof Node) el.appendChild(child);
  }
  return el;
};

const svg = (html) => { const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; };

// ---- PARTICLES ----
function createParticles() {
  const frag = document.createDocumentFragment();
  for (let i = 0; i < 30; i++) {
    const p = $('div', {className: 'particle', style: {
      left: Math.random() * 100 + '%',
      width: (Math.random() * 3 + 1) + 'px',
      height: (Math.random() * 3 + 1) + 'px',
      animationDuration: (Math.random() * 20 + 15) + 's',
      animationDelay: (Math.random() * 15) + 's',
      '--po': (Math.random() * 0.3 + 0.1)
    }});
    frag.appendChild(p);
  }
  return frag;
}

// ---- RENDER ----
function render() {
  const root = document.getElementById('root');
  document.documentElement.setAttribute('data-theme', state.theme);
  root.innerHTML = '';
  root.appendChild(renderApp());
}

function renderApp() {
  const app = $('div', {className: 'app'});

  // Background
  const bg = $('div', {className: 'bg'},
    $('div', {className: 'bg-base'}),
    $('div', {className: 'bg-grid'}),
    $('div', {className: 'bg-noise'}),
    $('div', {className: 'orb orb-1'}),
    $('div', {className: 'orb orb-2'}),
    $('div', {className: 'orb orb-3'})
  );
  bg.appendChild(createParticles());
  app.appendChild(bg);

  // Mobile overlay
  if (window.innerWidth <= 768) {
    const overlay = $('div', {className: 'sidebar-overlay' + (state.sidebarOpen ? ' show' : ''), onClick: () => setState({sidebarOpen: false})});
    app.appendChild(overlay);
  }

  // Sidebar
  app.appendChild(renderSidebar());

  // Main area
  const mainArea = $('div', {className: 'main-area'});
  mainArea.appendChild(renderNavbar());

  const scrollDiv = $('div', {className: 'main-scroll'});
  const content = $('div', {className: 'main-content'});

  if (state.messages.length === 0 && !state.typing) {
    content.appendChild(renderEmptyState());
  } else {
    content.appendChild(renderChatView());
  }

  scrollDiv.appendChild(content);
  mainArea.appendChild(scrollDiv);
  mainArea.appendChild(renderComposer());
  app.appendChild(mainArea);

  // Scroll to bottom after render
  requestAnimationFrame(() => { scrollDiv.scrollTop = scrollDiv.scrollHeight; });

  return app;
}

    fItem.appendChild($('span', {style: {fontSize: '1.1rem'}}, f.icon));
    const fi = $('div', {style: {flex: 1, minWidth: 0}});
    fi.appendChild($('div', {style: {fontSize: '0.8rem', fontWeight: 500}}, f.name));
    fi.appendChild($('div', {style: {fontSize: '0.65rem', color: 'var(--text-dim)'}}, f.desc));
    fItem.appendChild(fi);
    fileList.appendChild(fItem);
  });
  fileSection.appendChild(fileList);
  grid.appendChild(fileSection);
  es.appendChild(grid);

  // Drag zone
  const dz = $('div', {className: 'drag-zone'});
  dz.appendChild(svg(I.upload));
  dz.appendChild($('p', null, 'Drop your files here \u2014 or click to browse'));
  const formats = $('div', {className: 'formats'});
  ['PDF','DOCX','CSV','Images','Code','Markdown'].forEach(f => formats.appendChild($('span', null, f)));
  dz.appendChild(formats);
  es.appendChild(dz);

  // Tip card
  es.appendChild($('div', {className: 'extra-card', style: {width: '100%', marginBottom: 0}},
    $('div', {className: 'ec-icon'}, '\uD83D\uDCA1'),
    $('div', {className: 'ec-info'},
      $('div', {className: 'ec-title'}, 'AI Tip: Use \u2318K to search'),
      $('div', {className: 'ec-desc'}, 'Quickly find past conversations with the keyboard shortcut.')
    )
  ));

  return es;
}

// ---- CHAT VIEW ----
function renderChatView() {
  const view = $('div', {className: 'chat-view'});
  state.messages.forEach(msg => {
    view.appendChild(renderMessage(msg));
  });
  if (state.typing) {
    view.appendChild(renderTypingIndicator());
  }
  return view;
}

function renderMessage(msg) {
  const isUser = msg.role === 'user';
  const row = $('div', {className: 'message-row ' + (isUser ? 'user' : 'ai')});
  const avatar = $('div', {className: 'msg-avatar ' + msg.role});
  if (isUser) avatar.textContent = 'R';
  else avatar.appendChild(svg(I.sparkles));
  row.appendChild(avatar);

  const bubble = $('div', {className: 'msg-bubble'});
  const content = $('div', null);
  content.innerHTML = msg.text.replace(/\n/g, '<br>');
  bubble.appendChild(content);

  const meta = $('div', {className: 'msg-meta'});
  meta.appendChild($('span', null, msg.time));
  meta.appendChild($('span', null, 'Copy'));
  meta.appendChild($('span', null, 'Regenerate'));
  bubble.appendChild(meta);
  row.appendChild(bubble);
  return row;
}

function renderTypingIndicator() {
  const row = $('div', {className: 'message-row ai'});
  const avatar = $('div', {className: 'msg-avatar ai'});
  avatar.appendChild(svg(I.sparkles));
  row.appendChild(avatar);

  const ind = $('div', {className: 'typing-indicator'});
  ind.appendChild($('div', {className: 'typing-dot'}));
  ind.appendChild($('div', {className: 'typing-dot'}));
  ind.appendChild($('div', {className: 'typing-dot'}));
  row.appendChild(ind);
  return row;
}

// ---- COMPOSER ----
function renderComposer() {
  const wrap = $('div', {className: 'composer-wrap'});

  const composer = $('div', {className: 'composer'});

  const ta = $('textarea', {rows: 1, placeholder: 'Message Quantiva...', 'aria-label': 'Message composer',
    value: state.composerText,
    onInput: function(e) {
      const val = e.target.value;
      setState({composerText: val});
      this.style.height = 'auto';
      this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    },
    onKeyDown: function(e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); handleSend(this.value); }
    }
  });
  ta.style.minHeight = '28px';
  composer.appendChild(ta);

  const actions = $('div', {className: 'composer-actions'});

  const iconButtons = [
    {icon: I.paperclip, label: 'Attach file', key: null},
    {icon: I.mic, label: 'Voice input', key: null},
    {icon: I.image, label: 'Image', key: null},
    {icon: I.globe, label: 'Web search', key: 'web'},
    {icon: I.brain, label: 'Reasoning mode', key: 'reason'},
    {icon: I.code, label: 'Code mode', key: 'code'},
    {icon: I.smile, label: 'Emoji', key: null}
  ];

  iconButtons.forEach(btn => {
    const b = $('button', {className: 'composer-icon-btn' + (btn.key && state.modes[btn.key] ? ' active' : ''), 'aria-label': btn.label,
      onClick: () => {
        if (btn.key) {
          const modes = {...state.modes, [btn.key]: !state.modes[btn.key]};
          setState({modes});
        }
      }
    });
    b.innerHTML = btn.icon;
    actions.appendChild(b);
  });

  // Send button
  const sendBtn = $('button', {className: 'send-btn', disabled: !state.composerText.trim(), 'aria-label': 'Send message',
    onClick: () => handleSend(ta.value)
  });
  sendBtn.innerHTML = I.send;
  actions.appendChild(sendBtn);

  composer.appendChild(actions);
  wrap.appendChild(composer);

  // Mode badges
  const badgeRow = $('div', {className: 'composer-row'});
  if (state.modes.web) {
    badgeRow.appendChild($('span', {className: 'composer-badge active', onClick: () => setState({modes: {...state.modes, web: false}})}, svg(I.globe), ' Web Search'));
  }
  if (state.modes.reason) {
    badgeRow.appendChild($('span', {className: 'composer-badge active', onClick: () => setState({modes: {...state.modes, reason: false}})}, svg(I.brain), ' Reasoning'));
  }
  if (state.modes.code) {
    badgeRow.appendChild($('span', {className: 'composer-badge active', onClick: () => setState({modes: {...state.modes, code: false}})}, svg(I.code), ' Code Mode'));
  }
  wrap.appendChild(badgeRow);

  wrap.appendChild($('p', {className: 'disclaimer'}, 'Quantiva can make mistakes. Consider checking important information.'));

  return wrap;
}

// ---- HANDLERS ----
function toggleTheme() {
  setState({theme: state.theme === 'dark' ? 'light' : 'dark'});
}

function handleNewChat() {
  setState({activeChat: null, messages: [], typing: false});
}

function handleSend(text) {
  if (!text || !text.trim()) return;
  const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
  const newMsg = {role: 'user', text: text.trim(), time};
  setState({messages: [...state.messages, newMsg], composerText: '', typing: true});

  if (!state.activeChat) setState({activeChat: 'new-' + Date.now()});

  const replies = [
    "That's a great question! Let me break it down for you.\n\n**Key Points:**\n\n1. Quantiva uses a decoder-only transformer architecture\n2. It's optimized for training efficiency on single/multi-GPU setups\n3. The model supports both GPT-2 weight loading and training from scratch\n\nWould you like me to dive deeper into any of these aspects?",
    "I've analyzed your request. Here's what I found:\n\n\u2022 The implementation follows the standard GPT architecture\n\u2022 Flash attention is available for memory efficiency\n\u2022 The training loop is ~300 lines of clean PyTorch code\n\nReady to explore further?",
    "Here's a quick code snippet you might find useful:\n\n```python\ndef generate(self, idx, max_new_tokens):\n    for _ in range(max_new_tokens):\n        logits = self(idx)\n        logits = logits[:, -1, :]\n        probs = F.softmax(logits, dim=-1)\n        idx_next = torch.multinomial(probs, num_samples=1)\n        idx = torch.cat((idx, idx_next), dim=1)\n    return idx\n```\n\nThis is the core generation loop. Want me to explain it?"
  ];

  setTimeout(() => {
    const reply = replies[Math.floor(Math.random() * replies.length)];
    const replyTime = new Date().toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
    setState({messages: [...state.messages, {role: 'ai', text: reply, time: replyTime}], typing: false});
  }, 1500 + Math.random() * 1000);
}

// ---- KEYBOARD SHORTCUTS ----
document.addEventListener('keydown', e => {
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    const input = document.querySelector('.search-box input');
    if (input) input.focus();
  }
});

// Close context menu on click
document.addEventListener('click', () => { if (state.ctxMenu) setState({ctxMenu: null}); });

// Resize handler
window.addEventListener('resize', () => {
  const isMobile = window.innerWidth <= 768;
  if (!isMobile) setState({sidebarOpen: true});
});

// ---- INIT ----
render();
})();
</script>
</body>
